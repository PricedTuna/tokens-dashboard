<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consumo de tokens</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="header-content">
        <h1>Visualizador de consumo de tokens</h1>
        <p>Visualiza y compara el consumo de tokens de tus evaluaciones.</p>
      </div>
      <div class="section-header">
        <label for="fileInput" class="miro-select" id="upload-json-btn">
          Cargar JSON ⌄
        </label>
        <input type="file" id="fileInput" accept=".json" />
      </div>
    </header>

    <section class="summary-section">
      <div class="section-header">
        <h2>Resumen por Formato</h2>
        <button id="sortBtn" class="miro-button miro-shadow">Total Tokens ↓</button>
      </div>
      <div id="summaryContainer" class="summary-grid"></div>
    </section>

    <section id="comparisonSection" class="comparison-section" style="display: none;">
      <div class="section-header">
        <h2>Comparación</h2>
        <button id="clearComparisonBtn" class="miro-button">Limpiar</button>
      </div>
      <div id="comparisonContainer" class="comparison-grid"></div>
    </section>

    <section class="details-section">
      <div class="section-header">
        <h2>Detalles</h2>
        <div class="search-wrapper">
          <input type="text" id="searchInput" placeholder="Buscar..." />
        </div>
      </div>

      <div class="table-container">
        <div class="table-wrapper">
          <table id="resultsTable">
            <thead>
              <tr>
                <th>Question</th>
                <th>Formato</th>
                <th>Modelo</th>
                <th>Correcto</th>
                <th>Input</th>
                <th>Output</th>
                <th>Total</th>
                <th>No Cache</th>
                <th>Cache Read</th>
                <th>Cache Write</th>
                <th>Text</th>
                <th>Reasoning</th>
                <th>Latency</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
